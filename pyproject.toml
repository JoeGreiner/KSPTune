[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ksptune"
version = "0.1.0"
description = "Simple PETSc KSP tuning tools for exported linear-system snapshots."
requires-python = ">=3.10"
dependencies = [
  "ConfigSpace>=1.2",
  "PyYAML>=6",
  "smac>=2.4",
]

[project.optional-dependencies]
analysis = ["pandas>=2.2", "scikit-learn>=1.3"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8", "mypy>=1.11"]

[project.scripts]
ksptune = "ksptune.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
